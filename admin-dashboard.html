<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sifariş Paneli</title>
<style>
  :root {
    --bg: #f3f1ec;
    --surface: #fffcf8;
    --fg: #1c1917;
    --muted: #57534e;
    --subtle: #8a8378;
    --border: #e4ddd2;
    --accent: #1c3d4e;
    --accent-fg: #f6f3ee;
    --ok: #17693f;
    --ok-bg: #e5f4ec;
    --warn: #8a5a00;
    --warn-bg: #f8f0dc;
    --danger: #a3261d;
    --danger-bg: #fdeceb;
    --shadow: 0 16px 40px rgba(28, 25, 23, 0.16);
    font-family: "Segoe UI", system-ui, sans-serif;
    color: var(--fg);
    background: var(--bg);
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .wrap { width: min(1120px, calc(100% - 32px)); margin: 0 auto; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0 0; }
  h1 { margin: 0; font-size: 1.15rem; letter-spacing: -0.02em; }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 0.92rem; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 0; }
  .btn, .field, .chip {
    height: 44px;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 8px;
  }
  .btn { padding: 0 14px; font-weight: 600; }
  .btn.icon { width: 44px; padding: 0; }
  .btn.solid { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .field { padding: 0 12px; min-width: 0; }
  .grow { flex: 1; }
  .search { position: relative; width: 100%; padding-bottom: 12px; }
  .search input { width: 100%; padding-left: 36px; }
  .search svg { position: absolute; left: 12px; top: 14px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .chip { border-radius: 999px; padding: 0 14px; white-space: nowrap; font-weight: 600; font-size: 0.92rem; }
  .chip.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .card, .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
  }
  .stat { padding: 14px; }
  .stat h2, .block h3 { margin: 0; font-size: 0.75rem; font-weight: 600; color: var(--muted); }
  .stat strong { display: block; margin-top: 6px; font-variant-numeric: tabular-nums; font-size: 1.25rem; }
  .stat p, .note { margin: 4px 0 0; color: var(--subtle); font-size: 0.75rem; }
  .scroll { max-height: 96px; overflow: auto; margin-top: 8px; }
  .line { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--border); padding: 4px 0; font-size: 0.85rem; }
  .list { display: grid; grid-template-columns: 1fr; gap: 14px; margin: 16px 0 48px; }
  .order {
    content-visibility: auto;
    contain-intrinsic-size: auto 520px;
    padding: 16px;
    border-left: 4px solid var(--warn);
  }
  .order.ok { border-left-color: var(--ok); }
  .order.danger { border-left-color: var(--danger); }
  .head { display: flex; justify-content: space-between; gap: 8px; }
  .id { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 0.85rem; }
  .meta { color: var(--muted); font-size: 0.75rem; margin-top: 2px; }
  .badge { border-radius: 999px; padding: 4px 8px; font-size: 0.75rem; font-weight: 700; background: var(--warn-bg); color: var(--warn); }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.danger { background: var(--danger-bg); color: var(--danger); }
  .name { margin: 10px 0 0; font-size: 1.15rem; }
  .links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; font-size: 0.92rem; }
  .links a { color: var(--accent); font-weight: 650; }
  .warn { color: var(--warn); font-weight: 650; }
  .details { margin: 10px 0; font-weight: 650; }
  label { display: block; margin-top: 10px; }
  label span { display: block; margin-bottom: 4px; color: var(--muted); font-size: 0.75rem; font-weight: 600; }
  .field.full, textarea.field, select.field { width: 100%; }
  textarea.field { height: auto; min-height: 88px; padding: 8px 12px; resize: vertical; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  .ghost { height: 44px; }
  .save { margin-left: auto; color: var(--subtle); font-size: 0.75rem; }
  .danger-btn { background: none; border: 0; color: var(--danger); height: 44px; padding: 0 4px; font-weight: 650; }
  .count { color: var(--muted); font-size: 0.92rem; margin-top: 14px; }
  .empty, .error {
    padding: 24px;
    text-align: center;
    color: var(--muted);
  }
  .modal {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: none;
    align-items: flex-end;
    justify-content: center;
    padding: 12px;
    background: rgba(28, 25, 23, 0.4);
  }
  .modal.open { display: flex; }
  .sheet {
    width: min(640px, 100%);
    max-height: 88vh;
    overflow: auto;
    background: var(--surface);
    border-radius: 16px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    padding: 16px;
  }
  .sheet header { position: static; border: 0; display: flex; justify-content: space-between; align-items: center; background: transparent; }
  .sheet h2 { margin: 0; font-size: 1rem; }
  .sheet img { width: 100%; max-height: 70vh; object-fit: contain; background: #efebe3; border-radius: 8px; }
  .block { margin-top: 14px; }
  .summary { margin: 8px 0 0; line-height: 1.45; }
  #toasts { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 50; display: grid; gap: 8px; }
  .toast { background: var(--fg); color: var(--accent-fg); border-radius: 8px; padding: 10px 14px; font-size: 0.9rem; }
  .toast.bad { background: var(--danger); }
  @media (min-width: 800px) {
    .stats { grid-template-columns: repeat(4, 1fr); }
    .list { grid-template-columns: 1fr 1fr; }
    .modal { align-items: center; }
  }
  @media (min-width: 1200px) {
    .list { grid-template-columns: 1fr 1fr 1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Sifariş Paneli</h1>
        <p class="sub" id="dateLabel">Tarix hazırlanır</p>
      </div>
      <div class="row" style="padding:0">
        <button class="btn solid" id="analyzeBtn" type="button">Təhlil</button>
        <button class="btn icon" id="reloadBtn" type="button" aria-label="Yenilə">↻</button>
      </div>
    </div>
    <div class="row">
      <button class="btn icon" id="prevDay" type="button" aria-label="Əvvəlki gün">‹</button>
      <input class="field grow" id="date" type="date">
      <button class="btn icon" id="nextDay" type="button" aria-label="Növbəti gün">›</button>
      <button class="btn" id="todayBtn" type="button">Bu gün</button>
    </div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="#8a8378" stroke-width="1.5"/><path d="M10.5 10.5 14 14" stroke="#8a8378" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input class="field" id="search" type="search" placeholder="Ad, nömrə, ID, məhsul" autocomplete="off">
    </div>
  </div>
</header>
<main class="wrap">
  <div class="chips" id="chips"></div>
  <section class="stats" id="stats"></section>
  <p class="count" id="countLine"></p>
  <div class="list" id="list"></div>
</main>
<div class="modal" id="modal">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header>
      <h2 id="modalTitle"></h2>
      <button class="btn icon" id="modalClose" type="button" aria-label="Bağla">×</button>
    </header>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toasts"></div>
<script>
const API = "https://script.google.com/macros/s/AKfycbyV5tiuhDyteKE2Ug03l8F3qJeulRIyWkkrepSr_tC_1HffeXKBV_9nxOmqeHFY8VzQ/exec";
const WEEKDAYS = ["Bazar", "Bazar ertəsi", "Çərşənbə axşamı", "Çərşənbə", "Cümə axşamı", "Cümə", "Şənbə"];
const MONTHS = ["Yanvar", "Fevral", "Mart", "Aprel", "May", "İyun", "İyul", "Avqust", "Sentyabr", "Oktyabr", "Noyabr", "Dekabr"];
const photos = new Map();
const state = { date: "", orders: [], couriers: [], query: "", status: "all", courier: "", seq: 0 };

const $ = (id) => document.getElementById(id);

function money(n) { return (Number(n) || 0).toFixed(2); }
function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function shiftDate(iso, days) {
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + days);
  return dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0");
}
function longDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  return WEEKDAYS[dt.getDay()] + ", " + d + " " + MONTHS[m - 1];
}
function canceled(status) { return status === "Canceled" || status === "Deleted"; }
function statusLabel(status) {
  if (status === "Delivered") return "Çatdırılıb";
  if (canceled(status)) return "Ləğv edilib";
  return "Çatdırılır";
}
function rail(status) {
  if (status === "Delivered") return "ok";
  if (canceled(status)) return "danger";
  return "warn";
}
function waLink(phone) {
  let d = String(phone || "").replace(/\D/g, "");
  if (!d) return "";
  if (d.startsWith("0")) d = "994" + d.slice(1);
  else if (!d.startsWith("994")) d = "994" + d;
  return "https://wa.me/" + d;
}
function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => {
    const map = { "&": "amp", "<": "lt", ">": "gt", '"': "quot", "'": "#39" };
    return "&" + map[ch] + ";";
  });
}
function toast(message, bad) {
  const node = document.createElement("div");
  node.className = "toast" + (bad ? " bad" : "");
  node.textContent = message;
  $("toasts").appendChild(node);
  setTimeout(() => node.remove(), 2800);
}
function num(value) {
  const n = parseFloat(String(value ?? "").replace(",", "."));
  return Number.isFinite(n) ? n : 0;
}
function clock(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  return new Intl.DateTimeFormat("en-GB", { hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZone: "Asia/Baku" }).format(d);
}
function cleanPhoto(raw) {
  const text = String(raw || "").trim();
  const data = text.match(/^data:(image\/[a-zA-Z0-9.+-]+);base64,([A-Za-z0-9+/=]+)/);
  if (data) return "data:" + data[1] + ";base64," + data[2];
  const drive = text.match(/https?:\/\/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
  if (drive) return "https://drive.google.com/file/d/" + drive[1] + "/preview";
  const url = text.match(/https?:\/\/[^\s"]+/);
  return url ? url[0] : "";
}
function searchBlob(order) {
  const digits = order.phone.replace(/\D/g, "");
  return [order.id, order.customer, order.phone, digits, order.address, order.details, order.notes, order.courier, order.seller, order.status, statusLabel(order.status), order.pay === "card" ? "kart card" : "nağd nagd cash", order.window].join("\n").toLowerCase();
}
function parseOrder(row) {
  if (!Array.isArray(row) || row[0] == null || row[0] === "") return null;
  const id = String(row[0]).trim();
  const photo = cleanPhoto(row[20]);
  if (photo) photos.set(id, photo);
  const order = {
    id,
    customer: String(row[1] || "").trim(),
    phone: String(row[2] || "").trim(),
    address: String(row[3] || "").trim(),
    details: String(row[4] || "").trim(),
    notes: String(row[5] || "").trim(),
    status: String(row[6] || "").trim() || "Out for Delivery",
    courier: String(row[7] || "").trim(),
    amount: num(row[10]),
    pay: String(row[9] || "").trim().toLowerCase() === "card" ? "card" : "cash",
    seller: String(row[16] || "").trim() || "Digər",
    bonus: num(row[19]),
    hasPhoto: photo.length > 5,
    receipt: cleanPhoto(row[23]),
    window: String(row[22] || "").trim(),
    created: String(row[8] || "").trim(),
  };
  order.search = searchBlob(order);
  return order;
}

async function apiGet(params) {
  const url = API + "?" + params + "&_t=" + Date.now();
  const res = await fetch(url);
  if (!res.ok) throw new Error("Cədvəl açılmadı");
  return res.json();
}
async function apiPost(fields) {
  const res = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
    body: new URLSearchParams(fields),
  });
  const data = await res.json();
  if (!data || data.success === false) throw new Error(data && data.message ? data.message : "Saxlanmadı");
  return data;
}

function visibleOrders() {
  const q = state.query.trim().toLowerCase();
  return state.orders.filter((order) => {
    if (state.status === "canceled" && !canceled(order.status)) return false;
    if (state.status !== "all" && state.status !== "canceled" && order.status !== state.status) return false;
    if (state.courier && order.courier !== state.courier) return false;
    if (q && !order.search.includes(q)) return false;
    return true;
  });
}
function computeStats(orders) {
  const stats = { active: 0, canceled: 0, total: 0, cash: 0, card: 0, cashN: 0, cardN: 0, couriers: new Map(), debt: new Map(), sellers: new Map() };
  for (const order of orders) {
    const name = order.courier || "Təyin edilməyib";
    if (canceled(order.status)) stats.canceled += 1;
    else {
      stats.active += 1;
      stats.total += order.amount;
      if (order.pay === "cash") { stats.cash += order.amount; stats.cashN += 1; }
      else { stats.card += order.amount; stats.cardN += 1; }
      stats.couriers.set(name, (stats.couriers.get(name) || 0) + 1);
      stats.sellers.set(order.seller, (stats.sellers.get(order.seller) || 0) + 1);
    }
    if (order.courier && (order.status === "Delivered" || order.status === "Canceled")) {
      const row = stats.debt.get(order.courier) || { net: 0, card: 0 };
      row.net -= 5.8 + order.bonus;
      if (order.status === "Delivered") {
        if (order.pay === "cash") row.net += order.amount;
        else row.card += order.amount;
      }
      stats.debt.set(order.courier, row);
    }
  }
  return stats;
}

function renderStats() {
  const shown = visibleOrders();
  const stats = computeStats(shown);
  const courierRows = [...stats.couriers.entries()].sort((a, b) => b[1] - a[1]);
  const sellerRows = [...stats.sellers.entries()].sort((a, b) => b[1] - a[1]);
  const courierHtml = courierRows.map(([name, count]) => {
    const debt = stats.debt.get(name);
    const extra = debt ? "Borc " + money(debt.net) + (debt.card ? " · kart " + money(debt.card) : "") : "";
    return '<div class="line"><span>' + esc(name) + '</span><b>' + count + "</b></div>" + (extra ? '<div class="note">' + extra + "</div>" : "");
  }).join("") || '<p class="note">Məlumat yoxdur</p>';
  const sellerHtml = sellerRows.map(([name, count]) => '<div class="line"><span>' + esc(name) + "</span><b>" + count + "</b></div>").join("") || '<p class="note">Məlumat yoxdur</p>';
  $("stats").innerHTML =
    stat("Aktiv sifariş", stats.active, stats.canceled + " ləğv sayılmır") +
    stat("Satış", money(stats.total), "Nağd " + money(stats.cash) + " · Kart " + money(stats.card)) +
    '<article class="stat"><h2>Kuryer borcu</h2><p>Nağd − 5.80 ₼ − bonus</p><div class="scroll">' + courierHtml + "</div></article>" +
    '<article class="stat"><h2>Satıcılar</h2><div class="scroll">' + sellerHtml + "</div></article>";
  const all = state.orders.length;
  $("countLine").textContent = all === 0 ? "Bu tarixdə sifariş yoxdur" : shown.length === all ? all + " sifariş" : shown.length + " / " + all + " göstərilir";
  renderChips();
}
function stat(label, value, note) {
  return '<article class="stat"><h2>' + label + "</h2><strong>" + value + '</strong><p>' + note + "</p></article>";
}
function counts() {
  let out = 0, done = 0, cancel = 0;
  for (const order of state.orders) {
    if (canceled(order.status)) cancel += 1;
    else if (order.status === "Delivered") done += 1;
    else out += 1;
  }
  return { all: state.orders.length, out, done, cancel };
}
function renderChips() {
  const c = counts();
  const items = [["all", "Hamısı", c.all], ["Out for Delivery", "Çatdırılır", c.out], ["Delivered", "Çatdırılıb", c.done], ["canceled", "Ləğv", c.cancel]];
  const names = [...new Set([...state.couriers, ...state.orders.map((order) => order.courier).filter(Boolean)])].sort((a, b) => a.localeCompare(b, "az"));
  $("chips").innerHTML = items.map(([value, label, count]) =>
    '<button class="chip' + (state.status === value ? " on" : "") + '" data-status="' + value + '" type="button">' + label + " " + count + "</button>"
  ).join("") + '<select class="chip" id="courierFilter" aria-label="Kuryerə görə süz"><option value="">Bütün kuryerlər</option>' +
    names.map((name) => '<option value="' + esc(name) + '"' + (state.courier === name ? " selected" : "") + ">" + esc(name) + "</option>").join("") + "</select>";
}

function cardHtml(order) {
  const phone = order.phone.replace(/[^\d+]/g, "");
  const wa = waLink(order.phone);
  const options = courierOptions(order.courier);
  return '<article class="card order ' + rail(order.status) + '" id="order-' + esc(order.id) + '" data-id="' + esc(order.id) + '">' +
    '<div class="head"><div><div class="id">#' + esc(order.id) + '</div><div class="meta">' + esc([clock(order.created), order.seller].filter(Boolean).join(" · ")) + "</div></div>" +
    '<span class="badge ' + rail(order.status) + '" data-badge>' + statusLabel(order.status) + "</span></div>" +
    '<h2 class="name">' + esc(order.customer || "Adsız müştəri") + "</h2>" +
    '<div class="links">' +
      (order.phone ? '<a href="tel:' + esc(phone) + '">' + esc(order.phone) + "</a>" : "<span>Nömrə yoxdur</span>") +
      (wa ? '<a href="' + wa + '" target="_blank" rel="noreferrer">WhatsApp</a>' : "") +
      (order.window ? "<span>" + esc(order.window) + "</span>" : "") +
      (order.courier ? "" : '<span class="warn">Kuryer təyin edilməyib</span>') +
    "</div>" +
    '<p class="details">' + esc(order.details || "Məhsul qeyd olunmayıb") + "</p>" +
    '<label><span>Status</span><select class="field full" data-field="status">' +
      option("Out for Delivery", "Çatdırılır", order.status) + option("Delivered", "Çatdırılıb", order.status === "Deleted" ? "Canceled" : order.status) + option("Canceled", "Ləğv edilib", order.status === "Deleted" ? "Canceled" : order.status) +
    "</select></label>" +
    '<label><span>Kuryer</span><select class="field full" data-field="courier"><option value="">Kuryer seçin</option>' + options + "</select></label>" +
    '<label><span>Ünvan</span><input class="field full" data-field="address" value="' + esc(order.address) + '" autocomplete="off"></label>' +
    '<label><span>Qeyd və tərkib</span><textarea class="field" data-field="notes">' + esc(order.notes) + "</textarea></label>" +
    '<div class="split"><label><span>Qiymət, AZN</span><input class="field full" data-field="amount" inputmode="decimal" value="' + esc(order.amount) + '"></label>' +
    '<label><span>Ödəniş</span><select class="field full" data-field="pay">' + option("cash", "Nağd", order.pay) + option("card", "Kart", order.pay) + "</select></label></div>" +
    (order.bonus > 0 ? '<p class="note">Kuryer bonusu ' + money(order.bonus) + " ₼</p>" : "") +
    '<div class="actions">' +
      (order.hasPhoto ? '<button class="btn ghost" type="button" data-act="photo">Şəkil</button>' : "") +
      (order.receipt ? '<button class="btn ghost" type="button" data-act="receipt">Qəbz</button>' : "") +
      '<span class="save" data-save></span></div>' +
    '<button class="danger-btn" type="button" data-act="delete">Sifarişi sil</button>' +
    "</article>";
}
function option(value, label, current) {
  return '<option value="' + value + '"' + (current === value ? " selected" : "") + ">" + label + "</option>";
}
function courierOptions(current) {
  const names = state.couriers.includes(current) || !current ? state.couriers : [current, ...state.couriers];
  return names.map((name) => '<option value="' + esc(name) + '"' + (name === current ? " selected" : "") + ">" + esc(name) + "</option>").join("");
}
function renderList() {
  const shown = visibleOrders();
  if (!state.orders.length) {
    $("list").innerHTML = '<div class="card empty">Bu tarixdə sifariş yoxdur.</div>';
  } else if (!shown.length) {
    $("list").innerHTML = '<div class="card empty">Bu süzgəcə uyğun sifariş yoxdur.</div>';
  } else {
    $("list").innerHTML = shown.map(cardHtml).join("");
  }
  renderStats();
}
function findOrder(id) { return state.orders.find((order) => order.id === id); }
function mark(card, text) {
  const node = card.querySelector("[data-save]");
  if (node) node.textContent = text;
  if (text === "Saxlanıldı") setTimeout(() => { if (node.textContent === "Saxlanıldı") node.textContent = ""; }, 1400);
}
async function commit(order, card, patch, fields) {
  const previous = { ...order };
  Object.assign(order, patch);
  order.search = searchBlob(order);
  mark(card, "Saxlanılır");
  refreshCardFace(card, order);
  renderStats();
  try {
    await apiPost(fields);
    mark(card, "Saxlanıldı");
  } catch (error) {
    Object.assign(order, previous);
    order.search = searchBlob(order);
    refreshCardFace(card, order);
    renderStats();
    mark(card, "");
    toast(error.message || "Saxlanmadı", true);
  }
}
function refreshCardFace(card, order) {
  card.className = "card order " + rail(order.status);
  const badge = card.querySelector("[data-badge]");
  badge.className = "badge " + rail(order.status);
  badge.textContent = statusLabel(order.status);
  const status = card.querySelector('[data-field="status"]');
  if (status) status.value = order.status === "Deleted" ? "Canceled" : order.status;
  const courier = card.querySelector('[data-field="courier"]');
  if (courier) courier.value = order.courier;
  const pay = card.querySelector('[data-field="pay"]');
  if (pay) pay.value = order.pay;
  for (const field of ["address", "notes", "amount"]) {
    const input = card.querySelector('[data-field="' + field + '"]');
    if (input && document.activeElement !== input) input.value = field === "amount" ? order.amount : order[field];
  }
}

function openModal(title, html) {
  $("modalTitle").textContent = title;
  $("modalBody").innerHTML = html;
  $("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal() {
  $("modal").classList.remove("open");
  $("modalBody").innerHTML = "";
  document.body.style.overflow = "";
}
function openPhoto(order) {
  const src = photos.get(order.id) || order.receipt;
  if (!src) { toast("Şəkil tapılmadı", true); return; }
  if (src.includes("drive.google.com")) {
    openModal("Sifariş #" + order.id, '<iframe title="Şəkil" src="' + esc(src) + '" style="width:100%;height:70vh;border:0;border-radius:8px" sandbox="allow-scripts allow-same-origin allow-popups"></iframe>');
    return;
  }
  openModal("Sifariş #" + order.id, '<img alt="" src="' + src + '">');
}

function buildReport() {
  const orders = state.orders;
  const stats = computeStats(orders);
  let delivered = 0, onRoad = 0, noPhone = 0, noAddress = 0, withPhoto = 0;
  const windows = new Map();
  const pending = [];
  const canceledOrders = [];
  const active = [];
  for (const order of orders) {
    if (canceled(order.status)) { canceledOrders.push(order); continue; }
    active.push(order);
    if (order.status === "Delivered") delivered += 1;
    else { onRoad += 1; pending.push(order); }
    if (!order.phone) noPhone += 1;
    if (!order.address.trim()) noAddress += 1;
    if (order.hasPhoto) withPhoto += 1;
    if (order.window) windows.set(order.window, (windows.get(order.window) || 0) + 1);
  }
  const avg = stats.active ? stats.total / stats.active : 0;
  const completion = stats.active ? Math.round((delivered / stats.active) * 100) : 0;
  const cashShare = stats.total ? Math.round((stats.cash / stats.total) * 100) : 0;
  const summary = stats.active === 0
    ? (orders.length ? "Bu gündə yalnız ləğv olunmuş sifarişlər var." : "Bu tarixdə sifariş yoxdur.")
    : stats.active + " aktiv sifarişdən " + delivered + "-i çatdırılıb, " + onRoad + "-i hələ yoldadır. Dövriyyə " + money(stats.total) + " AZN, orta çek " + money(avg) + " AZN. Nağdın payı " + cashShare + "%-dir.";
  const blocks = [];
  const add = (title, rows, note) => blocks.push({ title, rows, note });
  add("Vəziyyət", [
    ["Cəmi qeyd", orders.length],
    ["Aktiv", stats.active],
    ["Çatdırılıb", delivered + " · " + completion + "%"],
    ["Yolda", onRoad],
    ["Ləğv", stats.canceled],
    ["Şəkli olan", withPhoto + " / " + stats.active],
  ]);
  add("Pul", [
    ["Dövriyyə", money(stats.total) + " AZN"],
    ["Nağd", money(stats.cash) + " AZN · " + stats.cashN + " sifariş"],
    ["Kart", money(stats.card) + " AZN · " + stats.cardN + " sifariş"],
    ["Orta çek", money(avg) + " AZN"],
  ]);
  const attention = [];
  const unassigned = active.filter((order) => !order.courier);
  if (unassigned.length) attention.push(["Kuryersiz", unassigned.slice(0, 8).map((order) => "#" + order.id + " " + (order.customer || "adsız")).join(", ")]);
  if (noPhone) attention.push(["Nömrəsi yoxdur", noPhone + " aktiv sifariş"]);
  if (noAddress) attention.push(["Ünvanı yoxdur", noAddress + " aktiv sifariş"]);
  if (!attention.length) attention.push(["Açıq boşluq", "Nömrə, ünvan və kuryer doludur"]);
  add("Diqqət", attention);
  if (pending.length) {
    const rows = pending.slice(0, 12).map((order) => ["#" + order.id + " " + (order.customer || "adsız"), money(order.amount) + " AZN · " + (order.courier || "kuryer yox")]);
    if (pending.length > 12) rows.push(["Qalan", (pending.length - 12) + " sifariş də yoldadır"]);
    add("Hələ çatdırılmayıb", rows);
  }
  add("Kuryerlər", [...stats.couriers.entries()].sort((a, b) => b[1] - a[1]).map(([name, count]) => {
    const debt = stats.debt.get(name);
    return [name, count + " aktiv" + (debt ? " · borc " + money(debt.net) + " AZN" + (debt.card ? " · kart " + money(debt.card) + " AZN" : "") : "")];
  }), "Borc = çatdırılmış nağd − 5.80 ₼ − bonus. Ləğv olunanda da 5.80 çıxılır. Kart məbləği borca yazılmır.");
  add("Satıcılar", [...stats.sellers.entries()].sort((a, b) => b[1] - a[1]).map(([name, count]) => [name, count + " sifariş"]));
  if (windows.size) add("Saat pəncərəsi", [...windows.entries()].sort((a, b) => b[1] - a[1]).map(([name, count]) => [name, count + " sifariş"]));
  const top = [...active].sort((a, b) => b.amount - a.amount).slice(0, 3).filter((order) => order.amount > 0);
  if (top.length) add("Ən böyük sifarişlər", top.map((order) => ["#" + order.id + " " + (order.customer || "adsız"), money(order.amount) + " AZN · " + (order.pay === "card" ? "kart" : "nağd") + " · " + statusLabel(order.status)]));
  if (canceledOrders.length) add("Ləğvlər", canceledOrders.slice(0, 8).map((order) => ["#" + order.id + " " + (order.customer || "adsız"), money(order.amount) + " AZN · " + (order.courier || "kuryer yox")]));
  return { summary, blocks };
}
function showReport() {
  if (!state.orders.length) { toast("Bu tarixdə təhlil üçün sifariş yoxdur", true); return; }
  const report = buildReport();
  const html = '<p class="summary">' + esc(report.summary) + "</p>" + report.blocks.map((block) =>
    '<section class="block"><h3>' + esc(block.title) + "</h3>" +
    (block.note ? '<p class="note">' + esc(block.note) + "</p>" : "") +
    block.rows.map((row) => '<div class="line"><span>' + esc(row[0]) + '</span><b style="font-weight:600;text-align:right">' + esc(row[1]) + "</b></div>").join("") +
    "</section>"
  ).join("") + '<div class="actions"><button class="btn" type="button" id="copyReport">Kopyala</button></div>';
  openModal("Günlük təhlil · " + longDate(state.date), html);
  $("copyReport").onclick = async () => {
    const text = report.summary + "\n\n" + report.blocks.map((block) => block.title + "\n" + block.rows.map((row) => row[0] + ": " + row[1]).join("\n")).join("\n\n");
    try { await navigator.clipboard.writeText(text); toast("Kopyalandı"); }
    catch { toast("Kopyalanmadı", true); }
  };
}

async function load(date, force) {
  const token = ++state.seq;
  state.date = date;
  $("date").value = date;
  $("dateLabel").textContent = longDate(date) + " · yüklənir";
  sessionStorage.setItem("panel-date", date);
  if (force) photos.clear();
  try {
    const [ordersRes, usersRes] = await Promise.all([
      apiGet("action=getOrdersByDate&date=" + encodeURIComponent(date)),
      state.couriers.length && !force ? Promise.resolve(null) : apiGet("action=getDeliveryUsers"),
    ]);
    if (token !== state.seq) return;
    if (!ordersRes || ordersRes.success === false) throw new Error(ordersRes && ordersRes.message ? ordersRes.message : "Sifarişlər gəlmədi");
    photos.clear();
    state.orders = (ordersRes.orders || []).map(parseOrder).filter(Boolean);
    if (usersRes && usersRes.users) {
      state.couriers = [...new Set(usersRes.users.map((user) => String(user.username || "").trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, "az"));
    }
    $("dateLabel").textContent = longDate(date);
    renderList();
  } catch (error) {
    if (token !== state.seq) return;
    $("dateLabel").textContent = longDate(date);
    $("list").innerHTML = '<div class="card error">' + esc(error.message || "Şəbəkə xətası") + '<div><button class="btn solid" id="retry" type="button" style="margin-top:12px">Yenidən yüklə</button></div></div>';
    $("retry").onclick = () => load(state.date, true);
  }
}

$("list").addEventListener("change", (event) => {
  const target = event.target;
  const card = target.closest(".order");
  if (!card) return;
  const order = findOrder(card.dataset.id);
  if (!order) return;
  const field = target.dataset.field;
  if (field === "status") {
    const status = target.value;
    commit(order, card, { status }, { action: "updateOrderStatusAndPayment", orderId: order.id, status });
  } else if (field === "courier") {
    if (!target.value) return;
    commit(order, card, { courier: target.value }, { action: "assignOrder", orderId: order.id, assignedTo: target.value });
  } else if (field === "pay" || field === "address" || field === "notes" || field === "amount") {
    saveDetails(order, card);
  }
});
$("list").addEventListener("focusout", (event) => {
  const target = event.target;
  if (!target.dataset || !["address", "notes", "amount"].includes(target.dataset.field)) return;
  const card = target.closest(".order");
  const order = card && findOrder(card.dataset.id);
  if (order) saveDetails(order, card);
});
function saveDetails(order, card) {
  const address = card.querySelector('[data-field="address"]').value;
  const notes = card.querySelector('[data-field="notes"]').value;
  const amount = num(card.querySelector('[data-field="amount"]').value);
  const pay = card.querySelector('[data-field="pay"]').value === "card" ? "card" : "cash";
  if (address === order.address && notes === order.notes && amount === order.amount && pay === order.pay) return;
  commit(order, card, { address, notes, amount, pay }, {
    action: "updateOrderDetails",
    orderId: order.id,
    deliveryAddress: address,
    specialNotes: notes,
    orderPrice: String(amount),
    paymentMethod: pay,
  });
}
$("list").addEventListener("click", async (event) => {
  const button = event.target.closest("[data-act]");
  if (!button) return;
  const card = button.closest(".order");
  const order = card && findOrder(card.dataset.id);
  if (!order) return;
  if (button.dataset.act === "photo") openPhoto(order);
  if (button.dataset.act === "receipt") openModal("Qəbz", order.receipt.includes("drive.google.com") ? '<iframe title="Qəbz" src="' + esc(order.receipt) + '" style="width:100%;height:70vh;border:0"></iframe>' : '<img alt="" src="' + order.receipt + '">');
  if (button.dataset.act === "delete") {
    if (button.dataset.sure !== "1") {
      button.dataset.sure = "1";
      button.textContent = "Bəli, sil";
      return;
    }
    const previous = state.orders.slice();
    state.orders = state.orders.filter((item) => item.id !== order.id);
    renderList();
    try {
      await apiPost({ action: "deleteOrder", orderId: order.id });
      toast("Sifariş silindi");
    } catch (error) {
      state.orders = previous;
      renderList();
      toast(error.message || "Silinmədi", true);
    }
  }
});

$("chips").addEventListener("click", (event) => {
  const button = event.target.closest("[data-status]");
  if (!button) return;
  state.status = button.dataset.status;
  renderList();
});
$("chips").addEventListener("change", (event) => {
  if (event.target.id !== "courierFilter") return;
  state.courier = event.target.value;
  renderList();
});
$("search").addEventListener("input", (event) => {
  state.query = event.target.value;
  renderList();
});
$("date").addEventListener("change", (event) => { if (event.target.value) load(event.target.value, false); });
$("prevDay").onclick = () => load(shiftDate(state.date, -1), false);
$("nextDay").onclick = () => load(shiftDate(state.date, 1), false);
$("todayBtn").onclick = () => load(todayISO(), false);
$("reloadBtn").onclick = () => load(state.date, true);
$("analyzeBtn").onclick = showReport;
$("modalClose").onclick = closeModal;
$("modal").addEventListener("click", (event) => { if (event.target.id === "modal") closeModal(); });
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") closeModal();
  if (event.key === "/" && !event.metaKey && !event.ctrlKey && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
    event.preventDefault();
    $("search").focus();
  }
});

const saved = sessionStorage.getItem("panel-date");
load(saved && /^\d{4}-\d{2}-\d{2}$/.test(saved) ? saved : todayISO(), false);
</script>
</body>
</html>
