<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f3f1ec">
<title>Sifariş Paneli</title>
<style>
  :root {
    --bg: #f3f1ec;
    --surface: #fffcf8;
    --fg: #1c1917;
    --muted: #57534e;
    --subtle: #6b655b;
    --border: #e4ddd2;
    --accent: #1c3d4e;
    --accent-fg: #f6f3ee;
    --ok: #17693f;
    --ok-bg: #e5f4ec;
    --warn: #8a5a00;
    --warn-bg: #f8f0dc;
    --danger: #a3261d;
    --danger-bg: #fdeceb;
    --shadow: 0 16px 40px rgba(28, 25, 23, 0.16);
    --gutter: clamp(12px, 3.5vw, 28px);
    --tap: 44px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--fg);
    background: var(--bg);
    color-scheme: light;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scrollbar-gutter: stable; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    line-height: 1.4;
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    -webkit-tap-highlight-color: transparent;
  }
  h1, h2, h3, p { margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; touch-action: manipulation; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- Layout wrapper ---------- */
  .wrap { width: min(1360px, calc(100% - var(--gutter) * 2)); margin-inline: auto; }

  /* ---------- Header ---------- */
  .site {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding-top: env(safe-area-inset-top);
    transition: transform 0.22s ease;
  }
  .bar {
    display: grid;
    gap: 8px;
    padding: 8px 0 10px;
    align-items: center;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas:
      "brand actions"
      "date date"
      "search search";
  }
  .brand { grid-area: brand; min-width: 0; }
  .brand h1 { font-size: 1.15rem; letter-spacing: -0.02em; line-height: 1.2; }
  .sub { margin-top: 2px; color: var(--muted); font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-actions { grid-area: actions; display: flex; gap: 8px; }
  .datebar {
    grid-area: date;
    display: grid;
    grid-template-columns: var(--tap) minmax(0, 1fr) var(--tap) auto;
    gap: 8px;
  }
  .search { grid-area: search; position: relative; min-width: 0; }
  .search input { width: 100%; padding-left: 38px; -webkit-appearance: none; appearance: none; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; }

  /* ---------- Controls ---------- */
  .btn, .field, .chip {
    height: var(--tap);
    min-height: var(--tap);
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 10px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 0 14px;
    font-weight: 600;
    white-space: nowrap;
  }
  .btn.icon { width: var(--tap); padding: 0; }
  .btn.solid { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .btn.small { height: 40px; min-height: 40px; padding: 0 12px; font-size: 0.9rem; }
  .btn:active, .chip:active { transform: scale(0.98); }
  @media (hover: hover) {
    .btn:hover:not(.solid), .chip:hover { border-color: #cdc3b3; }
    .btn.solid:hover { background: #17323f; }
  }
  .field { padding: 0 12px; min-width: 0; width: 100%; text-overflow: ellipsis; }
  input[type="date"].field { -webkit-appearance: none; appearance: none; text-align: left; }
  input[type="date"].field::-webkit-date-and-time-value { text-align: left; min-height: 1.2em; }
  textarea.field {
    height: auto;
    min-height: 4.2rem;
    padding: 10px 12px;
    resize: vertical;
    line-height: 1.4;
    field-sizing: content;
    max-height: 240px;
  }
  textarea.field.tall { min-height: 5.5rem; }
  .btn.icon svg, .btn.small svg { flex: none; }
  .btn.icon.spin svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Main + filters ---------- */
  main { display: flex; flex-direction: column; padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
  .chips {
    order: 1;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 12px 0 6px;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    padding: 0 14px;
    white-space: nowrap;
    font-weight: 600;
    font-size: 0.92rem;
  }
  .chip .n { font-variant-numeric: tabular-nums; opacity: 0.8; margin-left: 2px; }
  .chip.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  select.chip { border-radius: 999px; font-size: 1rem; max-width: 240px; text-overflow: ellipsis; }

  .listbar {
    order: 3;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 12px;
    min-height: 40px;
  }
  .count { color: var(--muted); font-size: 0.95rem; }
  .stats-toggle { display: none; }
  .stats-toggle svg { transition: transform 0.15s ease; }
  .stats-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }

  /* ---------- Stats ---------- */
  .stats {
    order: 2;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-top: 12px;
  }
  .card, .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
  }
  .stat { padding: 12px 14px; min-width: 0; }
  .stat h2, .block h3 { font-size: 0.8rem; font-weight: 600; color: var(--muted); }
  .stat strong { display: block; margin-top: 6px; font-variant-numeric: tabular-nums; font-size: 1.25rem; overflow-wrap: anywhere; }
  .stat p, .note { margin-top: 4px; color: var(--subtle); font-size: 0.8rem; overflow-wrap: anywhere; }
  .scroll { max-height: 132px; overflow: auto; margin-top: 8px; }
  .line {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    border-top: 1px solid var(--border);
    padding: 6px 0;
    font-size: 0.9rem;
  }
  .line span { min-width: 0; overflow-wrap: anywhere; }
  .line b { flex: 0 1 auto; max-width: 65%; text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

  /* ---------- Order list ---------- */
  .list {
    order: 4;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
    gap: 12px;
    margin-top: 4px;
    transition: opacity 0.15s ease;
  }
  .list[aria-busy="true"] .order { opacity: 0.55; pointer-events: none; }
  .order {
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: 14px;
    border-left: 4px solid var(--warn);
    container: card / inline-size;
    content-visibility: auto;
    contain-intrinsic-size: auto 560px;
  }
  .order.ok { border-left-color: var(--ok); }
  .order.danger { border-left-color: var(--danger); }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .head-main { min-width: 0; }
  .id { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 0.9rem; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 0.8rem; margin-top: 2px; overflow-wrap: anywhere; }
  .badge {
    flex: none;
    white-space: nowrap;
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 0.8rem;
    font-weight: 700;
    background: var(--warn-bg);
    color: var(--warn);
  }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.danger { background: var(--danger-bg); color: var(--danger); }
  .name { margin-top: 8px; font-size: 1.15rem; line-height: 1.25; overflow-wrap: anywhere; }
  .links { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
  .pill {
    display: inline-flex;
    align-items: center;
    min-height: var(--tap);
    max-width: 100%;
    padding: 0 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: #fff;
    color: var(--accent);
    font-size: 0.95rem;
    font-weight: 650;
    text-decoration: none;
    overflow-wrap: anywhere;
  }
  .pill.wa { color: var(--ok); }
  .tag { color: var(--muted); font-size: 0.9rem; overflow-wrap: anywhere; }
  .tag.warn { color: var(--warn); font-weight: 650; }
  .details { margin-top: 10px; font-weight: 650; overflow-wrap: anywhere; }
  .fields {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-top: 12px;
  }
  .fields label { display: block; min-width: 0; }
  .fields .wide { grid-column: 1 / -1; }
  .cap { display: block; margin-bottom: 4px; color: var(--muted); font-size: 0.8rem; font-weight: 600; }
  .order .note { margin-top: 10px; }
  .foot { margin-top: auto; padding-top: 12px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-height: 24px; }
  .save { margin-left: auto; color: var(--subtle); font-size: 0.8rem; }
  .danger-btn {
    display: inline-flex;
    align-items: center;
    background: none;
    border: 0;
    border-radius: 10px;
    color: var(--danger);
    height: var(--tap);
    padding: 0 4px;
    margin-top: 4px;
    font-weight: 650;
  }
  .danger-btn.armed { background: var(--danger); color: #fff; padding: 0 16px; }
  .empty, .error { padding: 24px; text-align: center; color: var(--muted); overflow-wrap: anywhere; }
  .empty { grid-column: 1 / -1; }
  .error { grid-column: 1 / -1; }

  @container card (max-width: 269px) {
    .fields { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 339px) {
    .fields { grid-template-columns: minmax(0, 1fr); }
  }

  /* ---------- Modal ---------- */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: none;
    align-items: flex-end;
    justify-content: center;
    background: rgba(28, 25, 23, 0.4);
  }
  .modal.open { display: flex; }
  .sheet {
    width: min(680px, 100%);
    max-height: 92vh;
    max-height: 92dvh;
    overflow: auto;
    overscroll-behavior: contain;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    box-shadow: var(--shadow);
    padding: 0 16px calc(16px + env(safe-area-inset-bottom));
  }
  .sheet-head {
    position: sticky;
    top: 0;
    z-index: 1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .sheet h2 { font-size: 1rem; overflow-wrap: anywhere; }
  .sheet img { display: block; width: 100%; max-height: 70vh; max-height: 70dvh; object-fit: contain; background: #efebe3; border-radius: 8px; margin-top: 12px; }
  .frame { display: block; width: 100%; height: min(70vh, 640px); height: min(70dvh, 640px); border: 0; border-radius: 8px; background: #efebe3; margin-top: 12px; }
  .open-link { display: inline-flex; align-items: center; min-height: var(--tap); color: var(--accent); font-weight: 650; }
  .block { margin-top: 14px; }
  .summary { margin-top: 12px; line-height: 1.45; overflow-wrap: anywhere; }
  .sheet .actions { margin-top: 12px; }

  /* ---------- Toasts ---------- */
  #toasts {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: calc(16px + env(safe-area-inset-bottom));
    z-index: 50;
    display: grid;
    justify-items: center;
    gap: 8px;
    pointer-events: none;
  }
  .toast { max-width: 100%; background: var(--fg); color: var(--accent-fg); border-radius: 10px; padding: 10px 14px; font-size: 0.9rem; overflow-wrap: anywhere; box-shadow: var(--shadow); }
  .toast.bad { background: var(--danger); }

  /* ---------- Phones ---------- */
  @media (max-width: 359px) {
    .datebar { grid-template-columns: var(--tap) minmax(0, 1fr) var(--tap); }
    #todayBtn { grid-column: 1 / -1; }
  }
  @media (max-width: 719px) {
    .chips { margin-inline: calc(var(--gutter) * -1); padding-inline: var(--gutter); scroll-padding-inline: var(--gutter); }
    .listbar { order: 2; }
    .stats { order: 3; }
    .stats-toggle { display: inline-flex; }
    .stat.detail { display: none; }
    .stats.open .stat.detail { display: block; grid-column: 1 / -1; }
  }
  /* Header slides away while scrolling down on phones and landscape screens */
  @media (max-width: 719px), (max-height: 520px) {
    .site.hide { transform: translateY(-101%); }
  }
  @media (max-height: 520px) {
    .bar { padding: 6px 0 8px; }
  }

  /* ---------- Tablets and up ---------- */
  @media (min-width: 720px) {
    .bar {
      grid-template-columns: auto minmax(0, 1fr);
      grid-template-areas:
        "brand actions"
        "date search";
      gap: 10px 16px;
    }
    .top-actions { justify-self: end; }
    .datebar { grid-template-columns: var(--tap) 168px var(--tap) auto; }
    .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .chips { flex-wrap: wrap; overflow: visible; }
    .modal { align-items: center; padding: 24px; }
    .sheet { border-radius: 16px; max-height: 88vh; max-height: 88dvh; }
  }
  @media (min-width: 1200px) {
    .bar {
      grid-template-columns: auto auto minmax(200px, 1fr) auto;
      grid-template-areas: "brand date search actions";
      gap: 12px 20px;
      padding: 10px 0;
    }
    .sub { max-width: 240px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<header class="site" id="siteHeader">
  <div class="wrap">
    <div class="bar">
      <div class="brand">
        <h1>Sifariş Paneli</h1>
        <p class="sub" id="dateLabel">Tarix hazırlanır</p>
      </div>
      <div class="top-actions">
        <button class="btn solid" id="analyzeBtn" type="button">Təhlil</button>
        <button class="btn icon" id="reloadBtn" type="button" aria-label="Yenilə">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>
      <div class="datebar">
        <button class="btn icon" id="prevDay" type="button" aria-label="Əvvəlki gün">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <input class="field" id="date" type="date" aria-label="Tarix">
        <button class="btn icon" id="nextDay" type="button" aria-label="Növbəti gün">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <button class="btn" id="todayBtn" type="button">Bu gün</button>
      </div>
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="#6b655b" stroke-width="1.5"/><path d="M10.5 10.5 14 14" stroke="#6b655b" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input class="field" id="search" type="search" placeholder="Ad, nömrə, ID, məhsul" autocomplete="off" aria-label="Axtarış" enterkeyhint="search">
      </div>
    </div>
  </div>
</header>
<main class="wrap">
  <div class="chips" id="chips"></div>
  <div class="listbar">
    <p class="count" id="countLine" aria-live="polite"></p>
    <button class="btn small stats-toggle" id="statsToggle" type="button" aria-expanded="false" aria-controls="stats">
      <span>Statistika</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
  </div>
  <section class="stats" id="stats" aria-label="Statistika"></section>
  <div class="list" id="list" aria-busy="false"></div>
</main>
<div class="modal" id="modal">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="sheet-head">
      <h2 id="modalTitle"></h2>
      <button class="btn icon" id="modalClose" type="button" aria-label="Bağla">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toasts" role="status" aria-live="polite"></div>
<script>
const API = "https://script.google.com/macros/s/AKfycbyV5tiuhDyteKE2Ug03l8F3qJeulRIyWkkrepSr_tC_1HffeXKBV_9nxOmqeHFY8VzQ/exec";
const WEEKDAYS = ["Bazar", "Bazar ertəsi", "Çərşənbə axşamı", "Çərşənbə", "Cümə axşamı", "Cümə", "Şənbə"];
const MONTHS = ["Yanvar", "Fevral", "Mart", "Aprel", "May", "İyun", "İyul", "Avqust", "Sentyabr", "Oktyabr", "Noyabr", "Dekabr"];
const photos = new Map();
const state = { date: "", orders: [], couriers: [], query: "", status: "all", courier: "", seq: 0, loaded: false, statsOpen: false };

const $ = (id) => document.getElementById(id);

/* Storage can be blocked (private mode, embedded frames); never let it break the panel. */
const memoryStore = {};
const store = {
  get(key, area) {
    try { return (area === "local" ? localStorage : sessionStorage).getItem(key); }
    catch (e) { return memoryStore[key] !== undefined ? memoryStore[key] : null; }
  },
  set(key, value, area) {
    try { (area === "local" ? localStorage : sessionStorage).setItem(key, value); }
    catch (e) { memoryStore[key] = value; }
  },
};

function money(n) { return (Number(n) || 0).toFixed(2); }
function pad2(n) { return String(n).padStart(2, "0"); }
function todayISO() {
  /* Baku calendar day, regardless of the device's own time zone. */
  try {
    const iso = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Baku", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
    if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso;
  } catch (e) { /* fall back to device date */ }
  const d = new Date();
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}
function shiftDate(iso, days) {
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + days);
  return dt.getFullYear() + "-" + pad2(dt.getMonth() + 1) + "-" + pad2(dt.getDate());
}
function longDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  return WEEKDAYS[dt.getDay()] + ", " + d + " " + MONTHS[m - 1];
}
function canceled(status) { return status === "Canceled" || status === "Deleted"; }
function statusLabel(status) {
  if (status === "Delivered") return "Çatdırılıb";
  if (canceled(status)) return "Ləğv edilib";
  return "Çatdırılır";
}
function rail(status) {
  if (status === "Delivered") return "ok";
  if (canceled(status)) return "danger";
  return "warn";
}
function waLink(phone) {
  let d = String(phone || "").replace(/\D/g, "");
  if (!d) return "";
  if (d.startsWith("0")) d = "994" + d.slice(1);
  else if (!d.startsWith("994")) d = "994" + d;
  return "https://wa.me/" + d;
}
function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => {
    const map = { "&": "amp", "<": "lt", ">": "gt", '"': "quot", "'": "#39" };
    return "&" + map[ch] + ";";
  });
}
function toast(message, bad) {
  const node = document.createElement("div");
  node.className = "toast" + (bad ? " bad" : "");
  node.textContent = message;
  $("toasts").appendChild(node);
  setTimeout(() => node.remove(), 2800);
}
function num(value) {
  const n = parseFloat(String(value ?? "").replace(",", "."));
  return Number.isFinite(n) ? n : 0;
}
function clock(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "";
  return new Intl.DateTimeFormat("en-GB", { hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZone: "Asia/Baku" }).format(d);
}
function cleanPhoto(raw) {
  const text = String(raw || "").trim();
  const data = text.match(/^data:(image\/[a-zA-Z0-9.+-]+);base64,([A-Za-z0-9+/=]+)/);
  if (data) return "data:" + data[1] + ";base64," + data[2];
  const drive = text.match(/https?:\/\/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
  if (drive) return "https://drive.google.com/file/d/" + drive[1] + "/preview";
  const url = text.match(/https?:\/\/[^\s"]+/);
  return url ? url[0] : "";
}
function searchBlob(order) {
  const digits = order.phone.replace(/\D/g, "");
  return [order.id, order.customer, order.phone, digits, order.address, order.details, order.notes, order.courier, order.seller, order.status, statusLabel(order.status), order.pay === "card" ? "kart card" : "nağd nagd cash", order.window].join("\n").toLowerCase();
}
function parseOrder(row) {
  if (!Array.isArray(row) || row[0] == null || row[0] === "") return null;
  const id = String(row[0]).trim();
  const photo = cleanPhoto(row[20]);
  if (photo) photos.set(id, photo);
  const order = {
    id,
    customer: String(row[1] || "").trim(),
    phone: String(row[2] || "").trim(),
    address: String(row[3] || "").trim(),
    details: String(row[4] || "").trim(),
    notes: String(row[5] || "").trim(),
    status: String(row[6] || "").trim() || "Out for Delivery",
    courier: String(row[7] || "").trim(),
    amount: num(row[10]),
    pay: String(row[9] || "").trim().toLowerCase() === "card" ? "card" : "cash",
    seller: String(row[16] || "").trim() || "Digər",
    bonus: num(row[19]),
    hasPhoto: photo.length > 5,
    receipt: cleanPhoto(row[23]),
    window: String(row[22] || "").trim(),
    created: String(row[8] || "").trim(),
  };
  order.search = searchBlob(order);
  return order;
}

async function readJson(res) {
  try { return await res.json(); }
  catch (e) { throw new Error("Cavab oxunmadı"); }
}
async function apiGet(params) {
  const url = API + "?" + params + "&_t=" + Date.now();
  const res = await fetch(url);
  if (!res.ok) throw new Error("Cədvəl açılmadı");
  return readJson(res);
}
async function apiPost(fields) {
  const res = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
    body: new URLSearchParams(fields),
  });
  const data = await readJson(res);
  if (!data || data.success === false) throw new Error(data && data.message ? data.message : "Saxlanmadı");
  return data;
}

function visibleOrders() {
  const q = state.query.trim().toLowerCase();
  return state.orders.filter((order) => {
    if (state.status === "canceled" && !canceled(order.status)) return false;
    if (state.status !== "all" && state.status !== "canceled" && order.status !== state.status) return false;
    if (state.courier && order.courier !== state.courier) return false;
    if (q && !order.search.includes(q)) return false;
    return true;
  });
}
function computeStats(orders) {
  const stats = { active: 0, canceled: 0, total: 0, cash: 0, card: 0, cashN: 0, cardN: 0, couriers: new Map(), debt: new Map(), sellers: new Map() };
  for (const order of orders) {
    const name = order.courier || "Təyin edilməyib";
    if (canceled(order.status)) stats.canceled += 1;
    else {
      stats.active += 1;
      stats.total += order.amount;
      if (order.pay === "cash") { stats.cash += order.amount; stats.cashN += 1; }
      else { stats.card += order.amount; stats.cardN += 1; }
      stats.couriers.set(name, (stats.couriers.get(name) || 0) + 1);
      stats.sellers.set(order.seller, (stats.sellers.get(order.seller) || 0) + 1);
    }
    if (order.courier && (order.status === "Delivered" || order.status === "Canceled")) {
      const row = stats.debt.get(order.courier) || { net: 0, card: 0 };
      row.net -= 5.8 + order.bonus;
      if (order.status === "Delivered") {
        if (order.pay === "cash") row.net += order.amount;
        else row.card += order.amount;
      }
      stats.debt.set(order.courier, row);
    }
  }
  return stats;
}

function renderStats() {
  const shown = visibleOrders();
  const stats = computeStats(shown);
  const courierRows = [...stats.couriers.entries()].sort((a, b) => b[1] - a[1]);
  const sellerRows = [...stats.sellers.entries()].sort((a, b) => b[1] - a[1]);
  const courierHtml = courierRows.map(([name, count]) => {
    const debt = stats.debt.get(name);
    const extra = debt ? "Borc " + money(debt.net) + (debt.card ? " · kart " + money(debt.card) : "") : "";
    return '<div class="line"><span>' + esc(name) + '</span><b>' + count + "</b></div>" + (extra ? '<div class="note">' + extra + "</div>" : "");
  }).join("") || '<p class="note">Məlumat yoxdur</p>';
  const sellerHtml = sellerRows.map(([name, count]) => '<div class="line"><span>' + esc(name) + "</span><b>" + count + "</b></div>").join("") || '<p class="note">Məlumat yoxdur</p>';
  $("stats").innerHTML =
    stat("Aktiv sifariş", stats.active, stats.canceled + " ləğv sayılmır") +
    stat("Satış", money(stats.total) + " ₼", "Nağd " + money(stats.cash) + " · Kart " + money(stats.card)) +
    '<article class="stat detail"><h2>Kuryer borcu</h2><p>Nağd − 5.80 ₼ − bonus</p><div class="scroll">' + courierHtml + "</div></article>" +
    '<article class="stat detail"><h2>Satıcılar</h2><div class="scroll">' + sellerHtml + "</div></article>";
  const all = state.orders.length;
  $("countLine").textContent = all === 0 ? "Bu tarixdə sifariş yoxdur" : shown.length === all ? all + " sifariş" : shown.length + " / " + all + " göstərilir";
  renderChips();
}
function stat(label, value, note) {
  return '<article class="stat"><h2>' + label + "</h2><strong>" + value + '</strong><p>' + note + "</p></article>";
}
function setStatsOpen(open, remember) {
  state.statsOpen = open;
  $("stats").classList.toggle("open", open);
  $("statsToggle").setAttribute("aria-expanded", open ? "true" : "false");
  if (remember) store.set("panel-stats", open ? "1" : "0", "local");
}
function counts() {
  let out = 0, done = 0, cancel = 0;
  for (const order of state.orders) {
    if (canceled(order.status)) cancel += 1;
    else if (order.status === "Delivered") done += 1;
    else out += 1;
  }
  return { all: state.orders.length, out, done, cancel };
}
let chipsHtml = "";
function renderChips() {
  const c = counts();
  const items = [["all", "Hamısı", c.all], ["Out for Delivery", "Çatdırılır", c.out], ["Delivered", "Çatdırılıb", c.done], ["canceled", "Ləğv", c.cancel]];
  const names = [...new Set([...state.couriers, ...state.orders.map((order) => order.courier).filter(Boolean)])].sort((a, b) => a.localeCompare(b, "az"));
  const html = items.map(([value, label, count]) =>
    '<button class="chip' + (state.status === value ? " on" : "") + '" data-status="' + value + '" type="button" aria-pressed="' + (state.status === value ? "true" : "false") + '">' + label + ' <span class="n">' + count + "</span></button>"
  ).join("") + '<select class="chip" id="courierFilter" aria-label="Kuryerə görə süz"><option value="">Bütün kuryerlər</option>' +
    names.map((name) => '<option value="' + esc(name) + '"' + (state.courier === name ? " selected" : "") + ">" + esc(name) + "</option>").join("") + "</select>";
  if (html === chipsHtml) return;
  chipsHtml = html;
  const box = $("chips");
  const left = box.scrollLeft;
  const active = document.activeElement;
  const focusKey = active && box.contains(active) ? (active.dataset.status || active.id) : "";
  box.innerHTML = html;
  box.scrollLeft = left;
  if (focusKey) {
    const again = box.querySelector('[data-status="' + focusKey + '"]') || box.querySelector("#" + focusKey);
    if (again) again.focus({ preventScroll: true });
  }
}
function centerChip() {
  const box = $("chips");
  const on = box.querySelector(".chip.on");
  if (!on || box.scrollWidth <= box.clientWidth) return;
  box.scrollTo({ left: on.offsetLeft - (box.clientWidth - on.offsetWidth) / 2, behavior: "smooth" });
}

function option(value, label, current) {
  return '<option value="' + value + '"' + (current === value ? " selected" : "") + ">" + label + "</option>";
}
function courierOptions(current) {
  const names = state.couriers.includes(current) || !current ? state.couriers : [current, ...state.couriers];
  return names.map((name) => '<option value="' + esc(name) + '"' + (name === current ? " selected" : "") + ">" + esc(name) + "</option>").join("");
}
function renderList() {
  const shown = visibleOrders();
  if (!state.orders.length) {
    $("list").innerHTML = '<div class="card empty">Bu tarixdə sifariş yoxdur.</div>';
  } else if (!shown.length) {
    $("list").innerHTML = '<div class="card empty">Bu süzgəcə uyğun sifariş yoxdur.</div>';
  } else {
    $("list").innerHTML = shown.map(cardHtml).join("");
  }
  renderStats();
}
function findOrder(id) { return state.orders.find((order) => order.id === id); }
function mark(card, text) {
  const node = card.querySelector("[data-save]");
  if (!node) return;
  node.textContent = text;
  if (text === "Saxlanıldı") setTimeout(() => { if (node.textContent === "Saxlanıldı") node.textContent = ""; }, 1400);
}
async function commit(order, card, patch, fields) {
  const previous = { ...order };
  Object.assign(order, patch);
  order.search = searchBlob(order);
  mark(card, "Saxlanılır");
  refreshCardFace(card, order);
  renderStats();
  try {
    await apiPost(fields);
    mark(card, "Saxlanıldı");
  } catch (error) {
    Object.assign(order, previous);
    order.search = searchBlob(order);
    refreshCardFace(card, order);
    renderStats();
    mark(card, "");
    toast(error.message || "Saxlanmadı", true);
  }
}
function refreshCardFace(card, order) {
  card.className = "card order " + rail(order.status);
  const badge = card.querySelector("[data-badge]");
  badge.className = "badge " + rail(order.status);
  badge.textContent = statusLabel(order.status);
  const status = card.querySelector('[data-field="status"]');
  if (status) status.value = order.status === "Deleted" ? "Canceled" : order.status;
  const courier = card.querySelector('[data-field="courier"]');
  if (courier) courier.value = order.courier;
  const pay = card.querySelector('[data-field="pay"]');
  if (pay) pay.value = order.pay;
  for (const field of ["address", "notes", "amount"]) {
    const input = card.querySelector('[data-field="' + field + '"]');
    if (input && document.activeElement !== input) input.value = field === "amount" ? order.amount : order[field];
  }
}

/* ---------- Daily report ---------- */
function buildReport() {
  const orders = state.orders;
  const stats = computeStats(orders);
  let delivered = 0, onRoad = 0, noPhone = 0, noAddress = 0, withPhoto = 0;
  const windows = new Map();
  const pending = [];
  const canceledOrders = [];
  const active = [];
  for (const order of orders) {
    if (canceled(order.status)) { canceledOrders.push(order); continue; }
    active.push(order);
    if (order.status === "Delivered") delivered += 1;
    else { onRoad += 1; pending.push(order); }
    if (!order.phone) noPhone += 1;
    if (!order.address.trim()) noAddress += 1;
    if (order.hasPhoto) withPhoto += 1;
    if (order.window) windows.set(order.window, (windows.get(order.window) || 0) + 1);
  }
  const avg = stats.active ? stats.total / stats.active : 0;
  const completion = stats.active ? Math.round((delivered / stats.active) * 100) : 0;
  const cashShare = stats.total ? Math.round((stats.cash / stats.total) * 100) : 0;
  const summary = stats.active === 0
    ? (orders.length ? "Bu gündə yalnız ləğv olunmuş sifarişlər var." : "Bu tarixdə sifariş yoxdur.")
    : stats.active + " aktiv sifarişdən " + delivered + "-i çatdırılıb, " + onRoad + "-i hələ yoldadır. Dövriyyə " + money(stats.total) + " AZN, orta çek " + money(avg) + " AZN. Nağdın payı " + cashShare + "%-dir.";
  const blocks = [];
  const add = (title, rows, note) => blocks.push({ title, rows, note });
  add("Vəziyyət", [
    ["Cəmi qeyd", orders.length],
    ["Aktiv", stats.active],
    ["Çatdırılıb", delivered + " · " + completion + "%"],
    ["Yolda", onRoad],
    ["Ləğv", stats.canceled],
    ["Şəkli olan", withPhoto + " / " + stats.active],
  ]);
  add("Pul", [
    ["Dövriyyə", money(stats.total) + " AZN"],
    ["Nağd", money(stats.cash) + " AZN · " + stats.cashN + " sifariş"],
    ["Kart", money(stats.card) + " AZN · " + stats.cardN + " sifariş"],
    ["Orta çek", money(avg) + " AZN"],
  ]);
  const attention = [];
  const unassigned = active.filter((order) => !order.courier);
  if (unassigned.length) attention.push(["Kuryersiz", unassigned.slice(0, 8).map((order) => "#" + order.id + " " + (order.customer || "adsız")).join(", ")]);
  if (noPhone) attention.push(["Nömrəsi yoxdur", noPhone + " aktiv sifariş"]);
  if (noAddress) attention.push(["Ünvanı yoxdur", noAddress + " aktiv sifariş"]);
  if (!attention.length) attention.push(["Açıq boşluq", "Nömrə, ünvan və kuryer doludur"]);
  add("Diqqət", attention);
  if (pending.length) {
    const rows = pending.slice(0, 12).map((order) => ["#" + order.id + " " + (order.customer || "adsız"), money(order.amount) + " AZN · " + (order.courier || "kuryer yox")]);
    if (pending.length > 12) rows.push(["Qalan", (pending.length - 12) + " sifariş də yoldadır"]);
    add("Hələ çatdırılmayıb", rows);
  }
  add("Kuryerlər", [...stats.couriers.entries()].sort((a, b) => b[1] - a[1]).map(([name, count]) => {
    const debt = stats.debt.get(name);
    return [name, count + " aktiv" + (debt ? " · borc " + money(debt.net) + " AZN" + (debt.card ? " · kart " + money(debt.card) + " AZN" : "") : "")];
  }), "Borc = çatdırılmış nağd − 5.80 ₼ − bonus. Ləğv olunanda da 5.80 çıxılır. Kart məbləği borca yazılmır.");
  add("Satıcılar", [...stats.sellers.entries()].sort((a, b) => b[1] - a[1]).map(([name, count]) => [name, count + " sifariş"]));
  if (windows.size) add("Saat pəncərəsi", [...windows.entries()].sort((a, b) => b[1] - a[1]).map(([name, count]) => [name, count + " sifariş"]));
  const top = [...active].sort((a, b) => b.amount - a.amount).slice(0, 3).filter((order) => order.amount > 0);
  if (top.length) add("Ən böyük sifarişlər", top.map((order) => ["#" + order.id + " " + (order.customer || "adsız"), money(order.amount) + " AZN · " + (order.pay === "card" ? "kart" : "nağd") + " · " + statusLabel(order.status)]));
  if (canceledOrders.length) add("Ləğvlər", canceledOrders.slice(0, 8).map((order) => ["#" + order.id + " " + (order.customer || "adsız"), money(order.amount) + " AZN · " + (order.courier || "kuryer yox")]));
  return { summary, blocks };
}
async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* try the fallback below */ }
  }
  const previous = document.activeElement;
  const area = document.createElement("textarea");
  area.value = text;
  area.setAttribute("readonly", "");
  area.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px";
  document.body.appendChild(area);
  area.select();
  area.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  area.remove();
  if (previous && previous.focus) previous.focus({ preventScroll: true });
  return ok;
}
function showReport() {
  if (!state.orders.length) { toast("Bu tarixdə təhlil üçün sifariş yoxdur", true); return; }
  const report = buildReport();
  const html = '<p class="summary">' + esc(report.summary) + "</p>" + report.blocks.map((block) =>
    '<section class="block"><h3>' + esc(block.title) + "</h3>" +
    (block.note ? '<p class="note">' + esc(block.note) + "</p>" : "") +
    block.rows.map((row) => '<div class="line"><span>' + esc(row[0]) + "</span><b>" + esc(row[1]) + "</b></div>").join("") +
    "</section>"
  ).join("") + '<div class="actions"><button class="btn" type="button" id="copyReport">Kopyala</button></div>';
  openModal("Günlük təhlil · " + longDate(state.date), html);
  $("copyReport").onclick = async () => {
    const text = report.summary + "\n\n" + report.blocks.map((block) => block.title + "\n" + block.rows.map((row) => row[0] + ": " + row[1]).join("\n")).join("\n\n");
    const ok = await copyText(text);
    toast(ok ? "Kopyalandı" : "Kopyalanmadı", !ok);
  };
}

/* ---------- Loading ---------- */
function setBusy(on) {
  $("list").setAttribute("aria-busy", on ? "true" : "false");
  $("reloadBtn").classList.toggle("spin", on);
}
async function load(date, force) {
  const token = ++state.seq;
  const changed = date !== state.date;
  state.date = date;
  $("date").value = date;
  $("dateLabel").textContent = longDate(date) + " · yüklənir";
  store.set("panel-date", date);
  setBusy(true);
  if (!state.loaded) $("list").innerHTML = '<div class="card empty">Yüklənir…</div>';
  if (changed) window.scrollTo(0, 0);
  if (force) photos.clear();
  try {
    const [ordersRes, usersRes] = await Promise.all([
      apiGet("action=getOrdersByDate&date=" + encodeURIComponent(date)),
      state.couriers.length && !force ? Promise.resolve(null) : apiGet("action=getDeliveryUsers"),
    ]);
    if (token !== state.seq) return;
    if (!ordersRes || ordersRes.success === false) throw new Error(ordersRes && ordersRes.message ? ordersRes.message : "Sifarişlər gəlmədi");
    photos.clear();
    state.orders = (ordersRes.orders || []).map(parseOrder).filter(Boolean);
    if (usersRes && usersRes.users) {
      state.couriers = [...new Set(usersRes.users.map((user) => String(user.username || "").trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, "az"));
    }
    state.loaded = true;
    $("dateLabel").textContent = longDate(date);
    setBusy(false);
    renderList();
  } catch (error) {
    if (token !== state.seq) return;
    state.loaded = true;
    setBusy(false);
    $("dateLabel").textContent = longDate(date);
    const message = error && error.name === "TypeError" ? "Şəbəkə xətası. İnterneti yoxlayın." : (error && error.message) || "Şəbəkə xətası";
    $("list").innerHTML = '<div class="card error">' + esc(message) + '<div><button class="btn solid" id="retry" type="button" style="margin-top:12px">Yenidən yüklə</button></div></div>';
    $("retry").onclick = () => load(state.date, true);
  }
}

/* ---------- Events ---------- */
$("list").addEventListener("change", (event) => {
  const target = event.target;
  const card = target.closest(".order");
  if (!card) return;
  const order = findOrder(card.dataset.id);
  if (!order) return;
  const field = target.dataset.field;
  if (field === "status") {
    const status = target.value;
    commit(order, card, { status }, { action: "updateOrderStatusAndPayment", orderId: order.id, status });
  } else if (field === "courier") {
    if (!target.value) return;
    commit(order, card, { courier: target.value }, { action: "assignOrder", orderId: order.id, assignedTo: target.value });
  } else if (field === "pay" || field === "address" || field === "notes" || field === "amount") {
    saveDetails(order, card);
  }
});
$("list").addEventListener("focusout", (event) => {
  const target = event.target;
  if (!target.dataset || !["address", "notes", "amount"].includes(target.dataset.field)) return;
  const card = target.closest(".order");
  const order = card && findOrder(card.dataset.id);
  if (order) saveDetails(order, card);
});
$("list").addEventListener("keydown", (event) => {
  /* Address is a single logical line: Enter finishes editing instead of adding a line break. */
  const target = event.target;
  if (event.key === "Enter" && !event.shiftKey && target.dataset && target.dataset.field === "address") {
    event.preventDefault();
    target.blur();
  }
});
function saveDetails(order, card) {
  const address = card.querySelector('[data-field="address"]').value.replace(/\s*[\r\n]+\s*/g, " ").trim();
  const notes = card.querySelector('[data-field="notes"]').value;
  const amount = num(card.querySelector('[data-field="amount"]').value);
  const pay = card.querySelector('[data-field="pay"]').value === "card" ? "card" : "cash";
  if (address === order.address && notes === order.notes && amount === order.amount && pay === order.pay) return;
  commit(order, card, { address, notes, amount, pay }, {
    action: "updateOrderDetails",
    orderId: order.id,
    deliveryAddress: address,
    specialNotes: notes,
    orderPrice: String(amount),
    paymentMethod: pay,
  });
}
$("list").addEventListener("click", async (event) => {
  const button = event.target.closest("[data-act]");
  if (!button) return;
  const card = button.closest(".order");
  const order = card && findOrder(card.dataset.id);
  if (!order) return;
  if (button.dataset.act === "photo") openPhoto(order);
  if (button.dataset.act === "receipt") openModal("Qəbz", mediaHtml("Qəbz", order.receipt));
  if (button.dataset.act === "delete") {
    if (button.dataset.sure !== "1") {
      button.dataset.sure = "1";
      button.classList.add("armed");
      button.textContent = "Bəli, sil";
      setTimeout(() => {
        if (button.isConnected && button.dataset.sure === "1") {
          delete button.dataset.sure;
          button.classList.remove("armed");
          button.textContent = "Sifarişi sil";
        }
      }, 4000);
      return;
    }
    const previous = state.orders.slice();
    state.orders = state.orders.filter((item) => item.id !== order.id);
    renderList();
    try {
      await apiPost({ action: "deleteOrder", orderId: order.id });
      toast("Sifariş silindi");
    } catch (error) {
      state.orders = previous;
      renderList();
      toast(error.message || "Silinmədi", true);
    }
  }
});

$("chips").addEventListener("click", (event) => {
  const button = event.target.closest("[data-status]");
  if (!button) return;
  state.status = button.dataset.status;
  renderList();
  centerChip();
});
$("chips").addEventListener("change", (event) => {
  if (event.target.id !== "courierFilter") return;
  state.courier = event.target.value;
  renderList();
});
let searchTimer = 0;
$("search").addEventListener("input", (event) => {
  state.query = event.target.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(renderList, 120);
});
$("statsToggle").onclick = () => setStatsOpen(!state.statsOpen, true);
$("date").addEventListener("change", (event) => { if (event.target.value) load(event.target.value, false); });
$("prevDay").onclick = () => load(shiftDate(state.date, -1), false);
$("nextDay").onclick = () => load(shiftDate(state.date, 1), false);
$("todayBtn").onclick = () => load(todayISO(), false);
$("reloadBtn").onclick = () => load(state.date, true);
$("analyzeBtn").onclick = showReport;
$("modalClose").onclick = closeModal;
$("modal").addEventListener("click", (event) => { if (event.target.id === "modal") closeModal(); });
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") closeModal();
  if (event.key === "/" && !event.metaKey && !event.ctrlKey && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
    event.preventDefault();
    $("siteHeader").classList.remove("hide");
    $("search").focus();
  }
});

/* Header: tucks away when scrolling down (phones / landscape), returns on scroll up or focus. */
(function headerAutoHide() {
  const header = $("siteHeader");
  let lastY = window.scrollY;
  let ticking = false;
  function update() {
    ticking = false;
    const y = Math.max(0, window.scrollY);
    const delta = y - lastY;
    if (y <= header.offsetHeight || delta < -6 || header.contains(document.activeElement)) header.classList.remove("hide");
    else if (delta > 6) header.classList.add("hide");
    if (Math.abs(delta) > 6 || y <= header.offsetHeight) lastY = y;
  }
  window.addEventListener("scroll", () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(update);
  }, { passive: true });
  header.addEventListener("focusin", () => header.classList.remove("hide"));
})();

setStatsOpen(store.get("panel-stats", "local") === "1", false);
const saved = store.get("panel-date");
load(saved && /^\d{4}-\d{2}-\d{2}$/.test(saved) ? saved : todayISO(), false);
</script>
